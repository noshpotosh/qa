name: Package release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run check
      - name: Match tag to package version
        env:
          TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.TAG!=='v'+require('./package.json').version) throw Error('Tag must match package version')"
      - run: node scripts/package-release.mjs dist
      - uses: actions/upload-artifact@v4
        with:
          name: qa-release
          path: dist/qa-*
  publish:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: qa-release
          path: dist
      - name: Publish versioned archive
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes
