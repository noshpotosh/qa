name: Requested QA repair
on:
  workflow_call:
    inputs:
      qa_ref:
        type: string
        required: true
      kind:
        type: string
        required: true
      number:
        type: string
        required: true
      sources:
        type: string
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      QA_APP_ID:
        required: false
      QA_APP_PRIVATE_KEY:
        required: false
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
concurrency:
  group: qa-repair-${{ github.repository }}-${{ inputs.kind }}-${{ inputs.number }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.request.outputs.active }}
      head: ${{ steps.request.outputs.head }}
    steps:
      - name: Validate immutable reference
        env:
          QA_REF: ${{ inputs.qa_ref }}
        run: '[[ "$QA_REF" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@v4
        with:
          repository: noshpotosh/qa
          ref: ${{ inputs.qa_ref }}
          path: .qa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot authorized request
        id: request
        uses: actions/github-script@v7
        env:
          KIND: ${{ inputs.kind }}
          NUMBER: ${{ inputs.number }}
          SOURCES: ${{ inputs.sources }}
          HAS_KEYS: ${{ secrets.OPENAI_API_KEY != '' && secrets.QA_APP_ID != '' && secrets.QA_APP_PRIVATE_KEY != '' }}
        with:
          script: |
            const fs = require('fs');
            const {collectRequest} = await import(`${process.cwd()}/.qa/lib/repair-github.mjs`);
            const {prepareEditor} = await import(`${process.cwd()}/.qa/scripts/repair-workspace.mjs`);
            const record = await collectRequest(github, {...context.repo, actor:context.actor,
              eventName:context.eventName, ref:context.ref, runId:String(context.runId),
              runAttempt:process.env.GITHUB_RUN_ATTEMPT, kind:process.env.KIND,
              number:Number(process.env.NUMBER), sources:process.env.SOURCES});
            if (process.env.HAS_KEYS !== 'true') {
              record.status = 'unavailable'; record.reason = 'Repair provider or GitHub App credentials missing.';
            }
            prepareEditor(record, '.qa-state');
            fs.writeFileSync('.qa-state/record.json',JSON.stringify(record));
            core.setOutput('head',record.currentHead);
            core.setOutput('active',String(record.status==='requested'));
            await core.summary.addRaw(`Repair request ${record.runId}: ${record.status}`).write();
      - uses: actions/upload-artifact@v4
        with:
          name: qa-repair-state-0
          path: .qa-state/
          include-hidden-files: true
          retention-days: 14
  edit:
    needs: collect
    if: needs.collect.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: noshpotosh/qa
          ref: ${{ inputs.qa_ref }}
          path: .qa
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qa-repair-state-0
          path: .qa-state
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.head }}
          path: subject
          persist-credentials: false
      - name: Propose requested replacements
        id: edit
        continue-on-error: true
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          working-directory: subject
          prompt-file: ${{ github.workspace }}/.qa-state/prompt.txt
          output-schema-file: ${{ github.workspace }}/.qa-state/schema.json
          sandbox: read-only
          safety-strategy: drop-sudo
      - name: Capture untrusted replacement data
        if: always()
        env:
          RESULT: ${{ steps.edit.outputs.final-message }}
        run: |
          mkdir -p .qa-candidate
          node -e "require('fs').writeFileSync('.qa-candidate/candidate.json',process.env.RESULT || '')"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-repair-candidate-1
          path: .qa-candidate/
          include-hidden-files: true
          retention-days: 14
  validate:
    needs: [collect, edit]
    if: always() && needs.collect.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          repository: noshpotosh/qa
          ref: ${{ inputs.qa_ref }}
          path: .qa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: qa-repair-state-0
          path: .qa-state
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-repair-candidate-1
          path: .qa-candidate
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.collect.outputs.head }}
          fetch-depth: 0
          path: subject
          persist-credentials: false
      - name: Validate in credential-free container
        run: node .qa/scripts/repair-workspace.mjs validate .qa-state/record.json subject .qa-candidate/candidate.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-repair-validation-1
          path: validation.json
          retention-days: 14
  publish:
    needs: [collect, validate]
    if: always() && needs.collect.outputs.active == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          repository: noshpotosh/qa
          ref: ${{ inputs.qa_ref }}
          path: .qa
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qa-repair-state-0
          path: .qa-state
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-repair-candidate-1
          path: .qa-candidate
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-repair-validation-1
          path: .qa-validation
      - uses: actions/create-github-app-token@v2
        id: app
        with:
          app-id: ${{ secrets.QA_APP_ID }}
          private-key: ${{ secrets.QA_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - name: Publish validated candidate and progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app.outputs.token }}
          script: |
            const fs = require('fs');
            const {publishCandidate,publishProgress} = await import(`${process.cwd()}/.qa/lib/repair-github.mjs`);
            const record = JSON.parse(fs.readFileSync('.qa-state/record.json','utf8'));
            const read = p => { try {return JSON.parse(fs.readFileSync(p,'utf8'));} catch {return null;} };
            const candidate = read('.qa-candidate/candidate.json');
            const validation = read('.qa-validation/validation.json') || {status:'unavailable'};
            let commit;
            try {
              commit = await publishCandidate(github,{...context.repo,record,candidate,validation});
              record.status='awaiting-review'; record.reason='Published candidate; independent review and CI acceptance remain pending.';
            } catch (e) {record.status='blocked';record.reason=e.message;}
            record.rounds.push({number:1,status:record.status,commit,validation,candidate});
            fs.writeFileSync('.qa-state/record.json',JSON.stringify(record));
            await publishProgress(github,{...context.repo,record});
            await core.summary.addRaw(`Repair request ${record.runId}: ${record.status}. ${record.reason}`).write();
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-repair-state-1
          path: .qa-state/record.json
          include-hidden-files: true
          retention-days: 14
