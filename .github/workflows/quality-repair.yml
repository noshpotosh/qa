name: Requested QA repair
on:
  workflow_call:
    inputs:
      qa_ref:
        type: string
        required: true
      kind:
        type: string
        required: true
      number:
        type: string
        required: true
      sources:
        type: string
        default: ''
    secrets:
      OPENAI_API_KEY:
        required: false
      ANTHROPIC_API_KEY:
        required: false
      QA_APP_ID:
        required: false
      QA_APP_PRIVATE_KEY:
        required: false
permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read
concurrency:
  group: qa-repair-${{ github.repository }}-${{ inputs.kind }}-${{ inputs.number }}
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      active: ${{ steps.request.outputs.active }}
      head: ${{ steps.request.outputs.head }}
    steps:
      - name: Validate immutable reference
        env:
          QA_REF: ${{ inputs.qa_ref }}
          TARGET_NUMBER: ${{ inputs.number }}
          TARGET_KIND: ${{ inputs.kind }}
        run: |
          [[ "$QA_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_NUMBER" =~ ^[1-9][0-9]*$ ]]
          [[ "$TARGET_KIND" == issue || "$TARGET_KIND" == pr ]]
      - uses: actions/checkout@v4
        with:
          repository: noshpotosh/qa
          ref: ${{ inputs.qa_ref }}
          path: .qa
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Snapshot authorized request
        id: request
        uses: actions/github-script@v7
        env:
          KIND: ${{ inputs.kind }}
          NUMBER: ${{ inputs.number }}
          SOURCES: ${{ inputs.sources }}
          HAS_KEYS: ${{ secrets.OPENAI_API_KEY != '' && secrets.QA_APP_ID != '' && secrets.QA_APP_PRIVATE_KEY != '' }}
        with:
          script: |
            const fs = require('fs');
            const {collectRequest} = await import(`${process.cwd()}/.qa/lib/repair-github.mjs`);
            const {prepareEditor} = await import(`${process.cwd()}/.qa/scripts/repair-workspace.mjs`);
            const record = await collectRequest(github, {...context.repo, actor:context.actor,
              eventName:context.eventName, ref:context.ref, runId:String(context.runId),
              runAttempt:process.env.GITHUB_RUN_ATTEMPT, kind:process.env.KIND,
              number:Number(process.env.NUMBER), sources:process.env.SOURCES});
            if (process.env.HAS_KEYS !== 'true') {
              record.status = 'unavailable'; record.reason = 'Repair provider or GitHub App credentials missing.';
            }
            prepareEditor(record, '.qa-state');
            fs.writeFileSync('.qa-state/record.json',JSON.stringify(record));
            core.setOutput('head',record.currentHead);
            core.setOutput('active',String(record.status==='requested'));
            await core.summary.addRaw(`Repair request ${record.runId}: ${record.status}`).write();
      - uses: actions/upload-artifact@v4
        with:
          name: qa-repair-state-0
          path: .qa-state/
          include-hidden-files: true
          retention-days: 14
  round-1:
    needs: collect
    if: needs.collect.outputs.active == 'true'
    uses: ./.github/workflows/quality-repair-round.yml
    with:
      qa_ref: ${{ inputs.qa_ref }}
      previous: 0
      round: 1
    secrets: inherit
  round-2:
    needs: round-1
    if: needs.round-1.outputs.decision == 'continue'
    uses: ./.github/workflows/quality-repair-round.yml
    with:
      qa_ref: ${{ inputs.qa_ref }}
      previous: 1
      round: 2
    secrets: inherit
  round-3:
    needs: round-2
    if: needs.round-2.outputs.decision == 'continue'
    uses: ./.github/workflows/quality-repair-round.yml
    with:
      qa_ref: ${{ inputs.qa_ref }}
      previous: 2
      round: 3
    secrets: inherit
