name: Quality review
on:
  workflow_call:
    inputs:
      agent:
        type: string
        default: codex
      qa_ref:
        description: Exact commit matching the reusable workflow version
        type: string
        required: true
    secrets:
      ANTHROPIC_API_KEY:
        required: false
      OPENAI_API_KEY:
        required: false
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    permissions:
      contents: read
    uses: ./.github/workflows/quality-engine.yml
    with:
      mode: pr
      agent: ${{ inputs.agent }}
      qa_ref: ${{ inputs.qa_ref }}
    secrets: inherit
  publish:
    needs: review
    if: always() && !cancelled() && needs.review.outputs.policy_status != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: noshpotosh/qa
          ref: ${{ inputs.qa_ref }}
          path: .qa
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: qa-context-pr
          path: .qa-output
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: qa-agent-pr
          path: .qa-result
      - name: Validate and publish
        uses: actions/github-script@v7
        env:
          MODE: pr
          ELIGIBLE: ${{ needs.review.outputs.eligible }}
        with:
          script: |
            const fs = require('fs');
            const {parseAgent,publishPR,publishAudit} = await import(`${process.cwd()}/.qa/lib/publish.mjs`);
            const {renderReport,validateReport} = await import(`${process.cwd()}/.qa/lib/report.mjs`);
            const c=JSON.parse(fs.readFileSync('.qa-output/context.json','utf8'));
            const policy=validateReport(JSON.parse(fs.readFileSync('.qa-output/policy.json','utf8')));
            let text='';try{text=fs.readFileSync('.qa-result/agent.json','utf8');}catch{}
            const agent=parseAgent(text,process.env.MODE==='audit'?10:100);
            fs.mkdirSync('.qa-result',{recursive:true});
            fs.writeFileSync('.qa-result/report.json',JSON.stringify({policy,agent},null,2));
            await core.summary.addRaw(renderReport(policy)+renderReport(agent,{advisory:true})).write();
            if(process.env.MODE==='pr') {
              // Fork tokens cannot comment. The summary and artifact remain available.
              if(process.env.ELIGIBLE==='true') await publishPR(github,{...context.repo,number:c.metadata.number,snapshot:c.metadata,policy,agent});
            } else await publishAudit(github,{...context.repo,report:agent,head:c.metadata.head});
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-report-pr
          path: .qa-result/report.json
          retention-days: 14
